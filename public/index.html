<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marketing Budget Optimizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .data-section, .report-section {
            margin-top: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #report {
            background: #f9f9f9;
            padding: 20px;
            border-left: 5px solid #3498db;
            margin-top: 20px;
            display: none;
            line-height: 1.6;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #3498db;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Marketing Budget Optimizer</h1>
    
    <div class="data-section">
        <h2>Current Campaign Data</h2>
        <p>This is the raw marketing data currently being tracked by the company.</p>
        <table>
            <thead>
                <tr>
                    <th>Campaign ID</th>
                    <th>Channel</th>
                    <th>Spend ($)</th>
                    <th>Clicks</th>
                    <th>Conversions</th>
                    <th>Revenue ($)</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <!-- Data populated via JS -->
            </tbody>
        </table>
    </div>

    <button id="analyzeBtn" class="btn">🚀 Run AI Budget Optimization</button>
    <div id="loader" class="loader">Gemini AI is analyzing the data... Please wait...</div>

    <div class="report-section">
        <div id="report"></div>
    </div>
</div>

<script>
    // Fetch and display data
    fetch('/api/data')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('dataTableBody');
            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td>${row.campaign_id}</td>
                        <td>${row.channel}</td>
                        <td>$${row.spend_usd.toLocaleString()}</td>
                        <td>${row.clicks.toLocaleString()}</td>
                        <td>${row.conversions.toLocaleString()}</td>
                        <td>$${row.revenue_generated_usd.toLocaleString()}</td>
                    </tr>
                `;
            });
        });

    // Run AI Analysis
    document.getElementById('analyzeBtn').addEventListener('click', () => {
        const btn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const reportDiv = document.getElementById('report');

        btn.disabled = true;
        loader.style.display = 'block';
        reportDiv.style.display = 'none';
        reportDiv.innerHTML = '';

        fetch('/api/analyze')
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                btn.disabled = false;
                
                if (data.error) {
                    reportDiv.innerHTML = `<h3 style="color:red;">Error: ${data.error}</h3>`;
                } else {
                    reportDiv.innerHTML = data.report;
                }
                reportDiv.style.display = 'block';
            })
            .catch(err => {
                loader.style.display = 'none';
                btn.disabled = false;
                reportDiv.innerHTML = `<h3 style="color:red;">An error occurred</h3>`;
                reportDiv.style.display = 'block';
            });
    });
</script>

</body>
</html>
